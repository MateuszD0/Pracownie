name: Diagnostyka odczytu witryn
on:
  workflow_dispatch:
    inputs:
      domains:
        description: Domeny do sprawdzenia, oddzielone przecinkami
        type: string
        default: archido.pl,domydlanas.pl,lk-projekt.pl,archi-projekt.com.pl,dompp.pl,housecollection.pl
      verification_wait:
        description: Czas obserwacji po otwarciu strony (0–60 sekund)
        type: number
        default: 1.5
      headed:
        description: Otwórz standardowe okno Chromium w ekranie wirtualnym
        type: boolean
        default: false
      runner:
        description: System do niezależnego sprawdzenia dostępu
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: |
          args=(--domains "$DIAGNOSE_DOMAINS" --verification-wait "$VERIFICATION_WAIT" --publish)
          if [[ "$HEADED" == 'true' ]]; then
            if [[ "$RUNNER_OS" == 'Linux' ]]; then
              xvfb-run -a uv run python scripts/diagnose_access.py "${args[@]}" --headed
            else
              uv run python scripts/diagnose_access.py "${args[@]}" --headed
            fi
          else
            uv run python scripts/diagnose_access.py "${args[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSE_DOMAINS: ${{ inputs.domains }}
          VERIFICATION_WAIT: ${{ inputs.verification_wait }}
          HEADED: ${{ inputs.headed }}
