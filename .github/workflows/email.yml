name: E-mail z dziennym porównaniem
on:
  workflow_run:
    workflows: [Codzienny monitoring pracowni]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      day:
        description: 'Dzień raportu YYYY-MM-DD (puste = dziś w Polsce)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: pracownie-email
  cancel-in-progress: false
jobs:
  email:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Sprawdź konfigurację poczty
        id: config
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [[ -z "$REPORT_EMAIL_TO" || -z "$SMTP_PASSWORD" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=E-mail wymaga konfiguracji::Dodaj sekrety REPORT_EMAIL_TO i SMTP_PASSWORD w ustawieniach Actions. Raport pozostaje dostępny w dashboardzie.'
            echo 'Wysyłka nie jest aktywna: dodaj sekrety REPORT_EMAIL_TO i SMTP_PASSWORD w Settings → Secrets and variables → Actions.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        if: steps.config.outputs.configured == 'true'
        with:
          version: '0.12.23'
      - run: uv sync --frozen
        if: steps.config.outputs.configured == 'true'
      - name: Wyślij porównanie
        if: steps.config.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          REPORT_DAY: ${{ inputs.day }}
          SCAN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: uv run python -m pracownie.mailer --day "$REPORT_DAY" --scan-started-at "$SCAN_STARTED_AT"
