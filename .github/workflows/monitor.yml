name: Codzienny monitoring pracowni

on:
  workflow_run:
    workflows: [Testy]
    types: [completed]
    branches: [main]
  schedule:
    # Missed runs can be recovered by a tested deployment marked [scan].
    - cron: '17 6 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      scope:
        description: Zakres skanu (pilot ma oddzielne archiwum i stan)
        type: choice
        options: [pilot, full]
        default: pilot
        required: true
      rescan:
        description: Powtórz również poprawne odczyty z tego samego dnia
        type: boolean
        default: false
      repair_domains:
        description: 'Opcjonalnie: powtórz tylko te domeny, rozdzielone przecinkami (rescan wyłączony)'
        type: string
        default: ''

permissions:
  contents: write
  pages: read

jobs:
  scan:
    concurrency:
      group: pracownie-monitor
      cancel-in-progress: false
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_commit.message, '[scan]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    env:
      UV_FROZEN: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Zależności
        run: uv sync --frozen
      - name: Chromium i OCR
        run: |
          uv run playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-pol
      - name: Testy przed skanem
        run: uv run pytest -q -m 'not browser'
      - name: Zakres naprawy po wdrożeniu
        id: deployment
        if: github.event_name == 'workflow_run'
        env:
          DEPLOYMENT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'\[repair:([a-z0-9.,-]+)\]', os.environ['DEPLOYMENT_MESSAGE'])
          if match:
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write('repair_domains=' + match[1] + '\n')
          PY
      - name: Skan, raport i trwały zapis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_SCOPE: ${{ github.event_name == 'schedule' && 'full' || inputs.scope || 'full' }}
          FORCE_RESCAN: ${{ github.event_name == 'workflow_run' && !steps.deployment.outputs.repair_domains && 'true' || inputs.rescan || 'false' }}
          REPAIR_DOMAINS: ${{ inputs.repair_domains || steps.deployment.outputs.repair_domains || '' }}
        run: |
          scan_args=(--github --scope "$SCAN_SCOPE" --budget-seconds 3600)
          if [[ "$FORCE_RESCAN" != 'true' ]]; then
            scan_args+=(--resume)
          fi
          if [[ -n "$REPAIR_DOMAINS" ]]; then
            scan_args+=(--repair-domains "$REPAIR_DOMAINS")
          fi
          uv run pracownie run "${scan_args[@]}"
      - name: Diagnostyka w razie awarii
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostyka-${{ github.run_id }}
          path: |
            raporty/**/*.txt
            raporty/**/pokrycie.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Sprawdź dostępność opcjonalnego adresu WWW
        id: pages
        run: uv run python -m pracownie.web --check-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Przygotuj gotowy widok HTML i zrzuty
        if: steps.pages.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')
        run: uv run python -m pracownie.web --source raporty
      - name: Zapisz stronę raportu
        if: steps.pages.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .monitor/pages
          retention-days: 1
  pages:
    concurrency:
      group: pracownie-pages
      cancel-in-progress: false
    needs: scan
    if: needs.scan.outputs.pages_enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj działający raport w przeglądarce
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
