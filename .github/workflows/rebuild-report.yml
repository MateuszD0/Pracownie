name: Odśwież układ raportu bez skanowania
on:
  workflow_dispatch:
    inputs:
      include_new_sites:
        description: Dodaj nowe pracownie z konfiguracji jako oczekujące na pierwszy skan
        type: boolean
        default: false
  workflow_run:
    workflows: [Testy]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  issues: read
  pages: read
jobs:
  rebuild:
    concurrency:
      group: pracownie-monitor
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[scan]') &&
       !contains(github.event.workflow_run.head_commit.message, '[mail]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen
      - name: Odczyt tekstu z zachowanych zrzutów
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-pol
      - run: uv run pytest -q -m 'not browser'
      - run: |
          rebuild_args=(--publish)
          if [[ "$INCLUDE_NEW_SITES" == 'true' ]]; then
            rebuild_args+=(--include-new-sites)
          fi
          uv run python -m pracownie.rebuild "${rebuild_args[@]}"
        env:
          INCLUDE_NEW_SITES: ${{ inputs.include_new_sites || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_EMAIL_CONFIGURED: ${{ secrets.REPORT_EMAIL_TO != '' && secrets.SMTP_PASSWORD != '' }}

      - name: Sprawdź dostępność opcjonalnego adresu WWW
        id: pages
        run: uv run python -m pracownie.web --check-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_EMAIL_CONFIGURED: ${{ secrets.REPORT_EMAIL_TO != '' && secrets.SMTP_PASSWORD != '' }}
      - name: Przygotuj gotowy widok HTML i zrzuty
        if: steps.pages.outputs.enabled == 'true'
        run: uv run python -m pracownie.web --source .monitor/report-rebuild/raporty
      - name: Zapisz stronę raportu
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .monitor/pages
          retention-days: 1
  pages:
    concurrency:
      group: pracownie-pages
      cancel-in-progress: false
    needs: rebuild
    if: needs.rebuild.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj działający raport w przeglądarce
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
