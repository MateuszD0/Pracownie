name: Automatyczne nadrabianie raportu i poczty
on:
  schedule:
    - cron: '41 * * * *'
    # Additional morning checks every 20 minutes, covering both Polish offsets.
    - cron: '11,31,51 2-7 * * *'
  workflow_run:
    workflows:
      - Codzienny monitoring pracowni
      - Odśwież układ raportu bez skanowania
      - Kontrola raportu — dane i termin 08:00
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pracownie-recovery
  cancel-in-progress: false
jobs:
  recovery:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - name: Sprawdź raport, nadrób braki i ponów niewysłaną pocztę
        run: uv run python -m pracownie.recovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_CONFIGURED: ${{ secrets.REPORT_EMAIL_TO != '' && secrets.SMTP_PASSWORD != '' }}
