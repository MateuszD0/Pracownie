[project]
name = "pracownie-monitor"
version = "0.1.0"
description = "Codzienny monitoring ofert projektów domów"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.56.0",
  "Pillow==12.0.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.2",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.1", "PyYAML==6.0.3"]

[project.scripts]
pracownie = "pracownie.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: testy funkcjonalne w Chromium"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/pracownie"]
